<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- dark backdrop so the neon mark reads on light tab bars -->
  <rect x="0" y="0" width="200" height="200" rx="42" fill="#041018" />

  <!-- L5 mark (arrow-L + circuit-5), centered -->
  <g transform="translate(-3 22)" fill="none" stroke="#7fefff" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M50 16 L30 50 L44 50 L44 150 L120 150 L120 136 L58 136 L58 50 L70 50 Z" />
    <path d="M170 46 L108 46 L108 92 L146 92 C168 92 176 104 176 120 C176 142 158 152 134 150 L116 150" />
    <path d="M132 60 L150 60" stroke-width="4" />
    <circle cx="156" cy="60" r="5" fill="#7fefff" stroke="none" />
    <path d="M120 74 L138 74" stroke-width="4" />
    <circle cx="144" cy="74" r="5" fill="#7fefff" stroke="none" />
    <circle cx="150" cy="122" r="5" fill="#7fefff" stroke="none" />
  </g>
</svg>
